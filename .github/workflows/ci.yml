name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts keeps husky from installing git hooks on a runner that
      # has no commits to make.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: |
          echo "::add-matcher::.github/problem-matchers/eslint.json"
          npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # Covers the parser, the components, and the integrity of the fixture
      # corpus: every diff is checksummed, so a line ending normalised in transit
      # fails here rather than silently changing what the parser is tested against.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
